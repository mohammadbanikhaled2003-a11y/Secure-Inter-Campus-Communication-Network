# swanctl.conf for gw-hq (HQ Security Gateway)
# Al al-Bayt University - Course 1305301
# Mandate: Mutual X.509 Certificate Authentication, AEAD + PFS, Pinned Remote Identity

connections {
    gw-to-branch {
        version = 2
        local_addrs  = 172.16.6.10
        remote_addrs = 172.16.6.20

        # Hardened IKE Proposals (AEAD + Curve25519 ECDH + SHA-384 PRF)
        proposals = aes256gcm16-prfsha384-curve25519, aes128gcm16-prfsha256-curve25519

        local {
            auth = pubkey
            certs = /work/pki/certs_out/gw-hq.crt
            id = gw-hq.g06.scp.lab
        }

        remote {
            auth = pubkey
            # SR07: Identity Pinning - Accept only gw-branch, reject staff certs
            id = gw-branch.g06.scp.lab
            cacerts = /work/pki/root/certs/ca.cert.pem
            revocation = strict
        }

        children {
            campus-net {
                local_ts  = 10.6.1.0/24
                remote_ts = 10.6.2.0/24

                # Hardened ESP Proposals with PFS
                esp_proposals = aes256gcm16-curve25519, aes128gcm16-curve25519

                # Start automatically when loaded
                start_action = trap
                dpd_action = restart
                close_action = restart
            }
        }

        # Dead Peer Detection & Rekeying
        dpd_delay = 30s
        dpd_timeout = 90s
        rekey_time = 4h
    }
}

secrets {
    private-gw-hq {
        file = /work/pki/certs_out/gw-hq.key
    }
}
