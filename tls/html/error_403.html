<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden - Access Denied</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: white;
            padding: 3rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            max-width: 480px;
            border-top: 4px solid #ef4444;
        }
        h1 { font-size: 3rem; margin: 0 0 1rem 0; color: #ef4444; }
        p { margin-bottom: 2rem; color: #64748b; font-size: 1.1rem; }
        a {
            background: #0f172a;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>403</h1>
        <p>Access Denied: A valid, authorized and unrevoked client certificate is required to view this resource.</p>
        <a href="/">Return to Campus Portal</a>
    </div>
</body>
</html>
