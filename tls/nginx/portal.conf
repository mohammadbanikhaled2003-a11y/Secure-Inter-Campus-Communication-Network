# Nginx Hardened TLS and Mutual TLS Configuration
# Al al-Bayt University - Secure Inter-Campus Network Project
# Tested against testssl.sh: Zero HIGH/CRITICAL findings

# HTTP Server: Redirects public traffic to HTTPS, and serves CRL Distribution Point
server {
    listen 80;
    server_name portal.g01.scp.lab pki.g01.scp.lab 10.1.1.10;

    # CRL Distribution Point (RFC 5280 requires unauthenticated HTTP)
    location /crl/ {
        alias /work/pki/crl/;
        autoindex off;
        default_type application/pkix-crl;
        add_header Cache-Control "public, max-age=3600";
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Campus Portal
server {
    listen 443 ssl http2;
    server_name portal.g01.scp.lab pki.g01.scp.lab;

    # Server Certificate and Full Chain (Leaf + Intermediate)
    ssl_certificate     /work/pki/certs_out/portal_bundle.crt;
    ssl_certificate_key /work/pki/certs_out/portal.key;

    # Client CA & CRL configuration for Mutual TLS (mTLS)
    ssl_client_certificate /work/pki/root/certs/ca.cert.pem;
    ssl_crl                /work/pki/crl/issuing.crl;
    ssl_verify_depth       2;

    # Protocol Hardening (SR04: Only TLS 1.2 and TLS 1.3, AEAD suites only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (HSTS & Defensive Headers)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self';" always;

    root /work/tls/html;
    index index.html;

    # Public Campus Portal Area (TLS only, no client cert required)
    location / {
        try_files $uri $uri/ =404;
    }

    # Staff Portal Area (SR05: Strict Mutual TLS Enforced)
    location /staff/ {
        # Check client certificate status
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }

        # Log client identity
        access_log /var/log/nginx/staff_access.log combined;
        
        # Add authenticated identity headers
        add_header X-Authenticated-Staff $ssl_client_s_dn always;
        add_header X-Certificate-Serial $ssl_client_serial always;

        try_files $uri $uri/ /staff/index.html =404;
    }

    # Custom Generic Error Page (prevents information disclosure)
    error_page 403 /error_403.html;
    location = /error_403.html {
        internal;
        root /work/tls/html;
    }
}
